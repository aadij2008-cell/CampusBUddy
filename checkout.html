```html
<!DOCTYPE html>
<html>

<head>
    <title>CampusBUddy - Check Out</title>
</head>

<body>

    <h1>📚 Library Check-Out</h1>

    <p>
        You are checking out from MAIT Central Library.
    </p>

    <button id="confirmCheckout">
        🚪 Confirm Check-Out
    </button>

    <p id="message"></p>

    <script>

        const button = document.getElementById("confirmCheckout");
        const message = document.getElementById("message");

        button.addEventListener("click", async function () {

            button.disabled = true;
            message.textContent = "Processing...";

            try {

                const response = await fetch(
                    "https://campusbuddy-0y4a.onrender.com/checkout",
                    {
                        method: "POST"
                    }
                );

                const data = await response.json();

                message.textContent = data.message;

            } catch (error) {

                console.error("Check-out error:", error);

                message.textContent =
                    "Unable to check out. Please try again.";

                button.disabled = false;
            }

        });

    </script>

</body>

</html>
```
